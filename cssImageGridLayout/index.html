<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid Layout</title>
    <!-- Could have og tags, more metas, icons -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="main">
        <img src="img/jasper-gribble-TTExgxV06KA-unsplash.jpg" loading="lazy"
            alt="A foggy beach with a large rock formation in the foreground" width="3603" height="5404">
        <img src="img/food.avif" loading="lazy" alt="A table topped with plates and bowls of food" loading="lazy"
            width="1170" height="780">
        <img src="img/florian-schmid-f1PzRPbqt0M-unsplash.jpg" loading="lazy"
            alt="A row of white apartment buildings next to a street" width="3648" height="5472">
        <img src="img/pawel-czerwinski-Wuu6H3mI7UA-unsplash.jpg" loading="lazy"
            alt="A living room with a white couch and a round window" width="8400" height="5600">
        <img src="img/bernhard-uTd-kylh7bE-unsplash.jpg" loading="lazy"
            alt="A building with a red door and a tree in front of it" width="3200" height="4799">
        <img src="img/beach.avif" loading="lazy" alt="A view of a beach from the top of a hill" width="1170"
            height="780">
    </main>
</body>

</html>
